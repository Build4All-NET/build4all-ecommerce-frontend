name: Keystore Diagnose

# Manual only. Answers one question: is the signing key CI uses one of the
# keystores that were committed to this repository's history?
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest

    env:
      # SHA-256 of each keystore that was committed here before #65 untracked
      # them. A digest identifies a file without revealing it, so comparing
      # digests answers the question without either key leaving its home.
      LEAKED_RELEASE_P12: 7ea326735bbdea75225885d074fae561cecd7d7a7a2a51a81eb5cab272afd91b
      LEAKED_RELEASE_NEW_P12: 154297d33106bbb13a5bfe12c32591cd12ceb7c06cb0c6ffe35c67389ca36895
      LEAKED_RELEASE_TEMP_P12: cb75b5df68f3ef011c862933e590be890dba5128bbad04cb984c010453bf5ef0
      LEAKED_RELEASE_JKS: 21e1d4af42ca6261aeeb4614db74f7ab95e9bf0772c9a5f51bc48c84c09756ce

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compare the signing key against the leaked ones
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          echo "${ANDROID_KEYSTORE_B64}" | base64 --decode > live.p12
          DIGEST="$(sha256sum live.p12 | cut -d' ' -f1)"

          echo "::group::Identity of the signing key in use"
          echo "SHA-256: ${DIGEST}"
          echo "Size:    $(stat -c %s live.p12) bytes"
          echo "::endgroup::"

          MATCH=""
          for name in RELEASE_P12 RELEASE_NEW_P12 RELEASE_TEMP_P12 RELEASE_JKS; do
            eval "known=\${LEAKED_${name}}"
            [ "$DIGEST" = "$known" ] && MATCH="$name"
          done

          echo ""
          echo "================================================"
          if [ -n "$MATCH" ]; then
            echo "VERDICT: EXPOSED — matches the committed ${MATCH}"
            echo "The key CI signs with is one of the keystores that sat in this"
            echo "public repository. It has to be rotated."
          else
            echo "VERDICT: NOT EXPOSED"
            echo "The key CI signs with is none of the four committed keystores,"
            echo "so nothing published here can be used to sign as you."
          fi
          echo "================================================"
          echo ""

          # Public information: this certificate ships inside every APK already.
          echo "::group::Signing certificate"
          keytool -list -v \
            -keystore live.p12 -storetype PKCS12 \
            -storepass "${ANDROID_KEYSTORE_PASSWORD}" \
            | grep -E 'Alias name|Owner|Valid from|SHA256:' || true
          echo "::endgroup::"

          rm -f live.p12
